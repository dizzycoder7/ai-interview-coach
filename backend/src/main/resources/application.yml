spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_interview}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${SECRET_KEY:defaultSecretKeyChangeInProduction}
    expiration: 86400000  # 24 hours in ms
  ai-engine-url: ${AI_ENGINE_URL:http://localhost:8000}
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET_NAME:ai-interview-recordings}

logging:
  level:
    com.aiinterview: DEBUG
